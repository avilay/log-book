[loggers]
keys=root

[handlers]
keys=logfile

[handler_logfile]
class=handlers.RotatingFileHandler
level=INFO
args=('/var/log/logbook-api/access.log','a')
formatter=logfileformatter

[formatters]
keys=logfileformatter

[logger_root]
level=INFO
handlers=logfile

[formatter_logfileformatter]
format=%(asctime)s:%(levelname)s:%(name)s: %(message)s

